name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: software_project/smartApp/backend
    env:
      # Unit tests import the auth middleware, which requires a secret at startup.
      JWT_SECRET: ci-only-test-secret-not-used-for-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: software_project/smartApp/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  flutter:
    name: Flutter analyze, test and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: software_project/smartApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter=compact

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: smartapp-android-debug
          path: software_project/smartApp/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
