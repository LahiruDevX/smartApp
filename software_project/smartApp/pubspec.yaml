name: smartApp
description: Smart Classroom IoT App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  http: ^1.2.2
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.0.2
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  google_fonts: ^6.2.1
  socket_io_client: ^3.1.6
  google_mlkit_face_detection: ^0.14.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/classroom_bg.jpg
    - assets/images/classroom_blue_bg.jpg
